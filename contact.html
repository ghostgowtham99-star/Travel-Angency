<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav">
            <h1>📍Travel Agency</h1>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="Destination.html">Destinations</a></li>
                    <li><a href="package.html">Package</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
               
        </div>
    </header> <!-- Added closing header tag for better HTML structure -->
        
    <section class="contact">
        <div>
            <h2>Contact us</h2>
            <p>We would love to hear from you!</p>
        </div>
    </section>
    
    <section class="contact-info">
        <h1>Get in Touch</h1>
        <div class="grid1">
            <div class="form-container">
                <h3>Send us a Message</h3>
                <!-- Added a form tag with an ID to capture the submission -->
                <form id="contactForm">
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" required placeholder="Enter your name"><br>
                    
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" required placeholder="Travelagency@gmail.com"><br>
                    
                    <label for="phone">Phone:</label><br>
                    <input type="tel" id="phone" required placeholder="+1234567890"><br>
                    
                    <label for="message">Message:</label><br>
                    <textarea id="message" required placeholder="Enter your message"></textarea><br>
                    
                    <button type="submit">Send Message</button>
                </form>
                <!-- Added a message paragraph to show success/error status -->
                <p id="formMessage" style="margin-top: 15px; font-weight: bold;"></p>
            </div>

            <div class="info">
                <h3>Our Location</h3>
                <p> Here Mappae</p>
                <p>📞 +91 23-456-7890</p>
                <p>✉ info@travelagency.com</p>
                <h4>Follow Us</h4>
                <div class="social">
                    <span>🌐</span>
                    <span>📘</span>
                    <span>🐦</span>
                    <span>📷</span>
                </div> <!-- Fixed closing tag -->
                <div class="map">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d387190.2799148788!2d-74.2598736877699!3d40.69767006376944!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c250b9e5b8a7b%3A0x7a6c8e5b8a7b!2sNew%20York%2C%20USA!5e0!3m2!1sen!2s!4v1600000000000!5m2!1sen!2s" width="600" height="450" style="border:0;" allowfullscreen="" aria-hidden="false" tabindex="0"></iframe>
                </div>
            </div>
        </div>
    </section>
    
    <button class="contbtn"><a href="index.html">Back to Home</a></button>
    
    <!-- Firebase SDK Setup and Logic -->
    <script type="module">
        // 1. Import necessary Firebase functions from the CDN
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 2. Your web app's Firebase configuration
        // IMPORTANT: Replace these with your actual Firebase project settings
        const firebaseConfig = {
             apiKey: "AIzaSyApU--i2FAVuNAT6uAi4Qxd65-6gadwNcA",
            authDomain: "travel-agency-e4607.firebaseapp.com",
            projectId: "travel-agency-e4607",
            storageBucket: "travel-agency-e4607.firebasestorage.app",
            messagingSenderId: "985724359675",
            appId: "1:985724359675:web:a3ee94692edd1389a2315e",
            measurementId: "G-4FLNDS4LHL"
        };

        // 3. Initialize Firebase and Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 4. Handle Form Submission
        const contactForm = document.getElementById('contactForm');
        const formMessage = document.getElementById('formMessage');

        contactForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevents page reload on submit
            
            // Collect the input values
            const nameValue = document.getElementById('name').value;
            const emailValue = document.getElementById('email').value;
            const phoneValue = document.getElementById('phone').value;
            const messageValue = document.getElementById('message').value;

            formMessage.textContent = "Sending message...";
            formMessage.style.color = "blue";

            try {
                // Save the data to a Firestore collection named "contacts"
                const docRef = await addDoc(collection(db, "contacts"), {
                    name: nameValue,
                    email: emailValue,
                    phone: phoneValue,
                    message: messageValue,
                    timestamp: new Date() // Records when the message was sent
                });
                
                formMessage.textContent = "Message sent successfully!";
                formMessage.style.color = "green";
                contactForm.reset(); // Clears the form fields
                
            } catch (error) {
                console.error("Error adding document: ", error);
                formMessage.textContent = "Error sending message. Please try again.";
                formMessage.style.color = "red";
            }
        });
    </script>
</body>
</html>
